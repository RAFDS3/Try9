name: Build Custom ROM Android

on:
  workflow_dispatch: # Memungkinkan Anda menjalankan build secara manual dari web GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repositori
      uses: actions/checkout@v4

    - name: Maksimalkan Ruang Disk (Sangat Penting)
      run: |
        echo "Menghapus software bawaan runner yang tidak diperlukan..."
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost
        sudo docker image prune -a -f
        df -h

    - name: Install Dependensi Build Android
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev

    - name: Install Repo Tool dari Google
      run: |
        mkdir -p ~/bin
        # Mengunduh langsung dari mirror biner resmi beralih ke objek mentah Google
        curl https://googleapis.com > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo
        
        # Langkah verifikasi opsional untuk memastikan file yang terunduh adalah kode script, bukan HTML
        head -n 5 /usr/bin/repo
        
    - name: Install Repo Tool dari Ubuntu Repo
      run: |
        sudo apt-get update
        sudo apt-get install -y repo

         
    - name: Konfigurasi Git
      run: |
        git config --global user.name "RAFDS3"
        git config --global user.email "wistaramahija3gmail.com"

    - name: AOSP 
      run: |
        mkdir android
        cd android
        repo init -u https://android.googlesource.com/platform/manifest -b android-15.0.0_r1 --git-lfs --depth=1
        
    - name: Repo Sync
      run: |
        cd android
        # Menurunkan kedalaman sync untuk menghemat ruang penyimpanan
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Device Tree
      run: |
        cd android
        git clone https://github.com -b android-15 device/xiaomi/tapas/topaz
        git clone https://github.com -b android-15 vendor/xiaomi/tapas/topaz
        git clone https://github.com -b android-15 kernel/xiaomi/tapas/topaz

    - name: build ROM
      run: |
        cd android
        source build/envsetup.sh
        lunch aosp_tapas/topaz-userdebug
        mka bacon -j$(nproc --all)

    - name: Unggah Hasil Build ROM
      uses: actions/upload-artifact@v4
      with:
        name: Custom-ROM-Output
        path: android/out/target/product/*/*.zip
